[project]
name = "rag-eval-suite"
version = "0.1.0"
description = "Copy-and-paste RAG evaluators, each measured on the same labeled failures."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "rank-bm25", "pypdf", "fonttools", "openai>=2", "sentence-transformers", "transformers", "torch", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest>=8"]
lettuce = ["lettucedetect==0.2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
